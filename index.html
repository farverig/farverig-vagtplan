<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Farverig · Vagtplan</title>
<style>
:root{--bg:#f5f5f3;--paper:#fff;--text:#171717;--muted:#777;--line:#e7e7e4;--chip:#efefec;--past:#a1a1a1}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:58px 28px 90px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:54px;gap:24px}.brand{font-size:14px;font-weight:800;letter-spacing:.14em}.title{font-size:42px;line-height:1;letter-spacing:-.04em;margin:8px 0 0;font-weight:650}.updated{font-size:12px;color:var(--muted);white-space:nowrap}
.section{margin-top:44px}.section-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 14px;border-bottom:1px solid #cfcfcb}.section-head h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.09em}.section-head span{font-size:12px;color:var(--muted)}
.labels,.shift{display:grid;grid-template-columns:210px minmax(280px,1fr) minmax(330px,.95fr);column-gap:30px}.labels{padding:18px 22px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8b8b87;font-weight:700}.shift{background:var(--paper);padding:25px 22px;border-top:1px solid var(--line);align-items:center}.shift:first-of-type{border-top:none;border-radius:12px 12px 0 0}.shift:last-child{border-radius:0 0 12px 12px}.date{font-size:16px;font-weight:700}.time{font-size:14px;margin-top:5px;color:#555}.event{font-size:16px;font-weight:650}.place{font-size:13px;color:var(--muted);margin-top:5px}.team{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start}.chip{background:var(--chip);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750;letter-spacing:.02em}
.shift.has-color{position:relative;box-shadow:inset 4px 0 0 var(--job-color);background:linear-gradient(90deg,var(--job-tint) 0,var(--paper) 145px)}
.shift.has-color .chip{background:var(--job-tint)}
.next{box-shadow:0 5px 22px rgba(0,0,0,.035);position:relative}.next:before{content:"NÆSTE";position:absolute;left:-9px;top:21px;transform:translateX(-100%);font-size:9px;letter-spacing:.12em;color:#777;font-weight:800}
.past-wrap{opacity:.56}.past-wrap .shift{background:#fafafa}.past-wrap .chip{background:#ececea}.past-wrap .section-head{border-color:#ddd}.footer{margin-top:58px;font-size:11px;color:#999;text-align:center}
@media(max-width:760px){.wrap{padding:34px 16px 60px}.top{margin-bottom:38px;align-items:flex-start}.title{font-size:34px}.updated{display:none}.labels{display:none}.shift{grid-template-columns:1fr;gap:16px;padding:20px 18px;margin-bottom:8px;border:0;border-radius:12px!important}.shift+.shift{border-top:0}.date-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.time{margin:0}.event{font-size:15px}.team{padding-top:3px}.chip{font-size:11px;padding:7px 10px}.next:before{display:none}.section{margin-top:36px}.section-head{margin-bottom:10px}}
.empty{background:var(--paper);border-radius:12px;padding:25px 22px;color:var(--muted);font-size:13px}
.error{background:var(--paper);border-radius:12px;padding:25px 22px;color:#555;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><div class="brand">FARVERIG</div><h1 class="title">Vagtplan</h1></div>
    <div class="updated" id="updated">Henter vagtplan…</div>
  </header>
  <section class="section">
    <div class="section-head"><h2>Kommende jobs</h2><span id="upcoming-count"></span></div>
    <div class="labels"><div>Dato & tid</div><div>Arrangement / sted</div><div>Team</div></div>
    <div id="upcoming"></div>
  </section>
  <section class="section past-wrap" id="past-section">
    <div class="section-head"><h2>Afsluttede jobs</h2><span>Seneste først</span></div>
    <div class="labels"><div>Dato & tid</div><div>Arrangement / sted</div><div>Team</div></div>
    <div id="past"></div>
  </section>
  <div class="footer" id="status">Vagtplanen opdateres automatisk fra Farverigs planlægningsark.</div>
</main>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9T6mmtSda556vJDyOS4bHnUtq3xGlSzrhzjVRourD3Bs0EwFDaE7vXCga8gwbLSGsi7qEMam9KKkF/pub?gid=1374397423&single=true&output=csv";
function parseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"'){
      if(quoted && n === '"'){ cell+='"'; i++; }
      else quoted=!quoted;
    } else if(c === ',' && !quoted){ row.push(cell); cell=""; }
    else if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && n === '\n') i++;
      row.push(cell); if(row.some(v=>v.trim()!=="")) rows.push(row); row=[]; cell="";
    } else cell+=c;
  }
  row.push(cell); if(row.some(v=>v.trim()!=="")) rows.push(row);
  return rows;
}
function parseDate(raw){
  const s=(raw||"").trim();
  let m=s.match(/^(\d{1,2})[.\/-]\s*(\d{1,2})[.\/-]\s*(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], 12);
  const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  m=s.match(/^(\d{1,2})[.\s-]+([A-Za-z]{3,})[.\s-]+(\d{4})$/);
  if(m && months[m[2].slice(0,3).toLowerCase()]!==undefined)
    return new Date(+m[3], months[m[2].slice(0,3).toLowerCase()], +m[1], 12);
  const d=new Date(s);
  return isNaN(d) ? null : d;
}
function fmtDate(d){
  const s=new Intl.DateTimeFormat("da-DK",{weekday:"short",day:"numeric",month:"short"}).format(d);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
function teamChips(team){
  return (team||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean)
    .map(n=>`<span class="chip">${esc(n.toUpperCase())}</span>`).join("");
}
const JOB_COLORS={
  pink:["#e6a6bb","#fbf0f4"], rosa:["#e6a6bb","#fbf0f4"],
  gul:["#e3c75f","#fbf7df"], yellow:["#e3c75f","#fbf7df"],
  grøn:["#8fb99c","#edf6ef"], green:["#8fb99c","#edf6ef"],
  lilla:["#ad9ac9","#f3eff8"], purple:["#ad9ac9","#f3eff8"],
  orange:["#dda06f","#faf0e8"],
  blå:["#8eabc7","#edf3f8"], blue:["#8eabc7","#edf3f8"]
};
function colorStyle(raw){
  const key=(raw||"").trim().toLowerCase();
  const pair=JOB_COLORS[key];
  return pair ? ` style="--job-color:${pair[0]};--job-tint:${pair[1]}"` : "";
}
function shiftHTML(j,next=false){
  const time=[j.from,j.to].filter(Boolean).join("–");
  const colored=!!JOB_COLORS[(j.color||"").trim().toLowerCase()];
  return `<div class="shift${next?" next":""}${colored?" has-color":""}"${colorStyle(j.color)}>
    <div class="date-row"><div class="date">${fmtDate(j.date)}</div><div class="time">${esc(time)}</div></div>
    <div><div class="event">${esc(j.event||"Arrangement")}</div>${j.place?`<div class="place">${esc(j.place)}</div>`:""}</div>
    <div class="team">${teamChips(j.team)}</div>
  </div>`;
}
async function load(){
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("Kunne ikke hente data");
    const rows=parseCSV(await res.text());
    const hi=rows.findIndex(r=>r.map(x=>x.trim().toLowerCase()).includes("dato"));
    if(hi<0) throw new Error("Kunne ikke finde kolonneoverskrifterne i arket.");
    const headers=rows[hi].map(x=>x.trim().toLowerCase());
    const idx=n=>headers.indexOf(n);
    const jobs=rows.slice(hi+1).map(r=>({
      date:parseDate(r[idx("dato")]), from:r[idx("fra")]||"", to:r[idx("til")]||"",
      event:r[idx("arrangement")]||"", place:r[idx("lokation")]||"", team:r[idx("team")]||"", color:idx("farve")>=0?(r[idx("farve")]||""):""
    })).filter(j=>j.date && (j.event||j.team));
    const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const upcoming=jobs.filter(j=>j.date>=today).sort((a,b)=>a.date-b.date);
    const past=jobs.filter(j=>j.date<today).sort((a,b)=>b.date-a.date);
    document.getElementById("upcoming").innerHTML=upcoming.length
      ? upcoming.map((j,i)=>shiftHTML(j,i===0)).join("")
      : `<div class="empty">Ingen kommende jobs lige nu.</div>`;
    document.getElementById("past").innerHTML=past.length
      ? past.map(j=>shiftHTML(j)).join("")
      : `<div class="empty">Ingen afsluttede jobs endnu.</div>`;
    document.getElementById("upcoming-count").textContent=`${upcoming.length} ${upcoming.length===1?"job":"jobs"}`;
    document.getElementById("updated").textContent="Live fra Farverigs vagtplan";
  }catch(err){
    document.getElementById("upcoming").innerHTML=`<div class="error"><strong>Vagtplanen kunne ikke hentes.</strong><br>Prøv at genindlæse siden om et øjeblik.</div>`;
    document.getElementById("past-section").style.display="none";
    document.getElementById("updated").textContent="Forbindelsesfejl";
    document.getElementById("status").textContent="Data kunne ikke hentes fra planlægningsarket.";
    console.error(err);
  }
}
load();
</script>
</body>
</html>
